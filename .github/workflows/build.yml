name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Minimal Android Project Structure
      run: |
        mkdir -p app/src/main/java/com/example/xomaster
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # إنشاء ملف الإعدادات الأساسي إذا لم يكن موجوداً
        if [ ! -f "build.gradle" ]; then
          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:7.4.2' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
        fi

        if [ ! -f "app/build.gradle" ]; then
          echo "apply plugin: 'com.android.application'" > app/build.gradle
          echo "android { compileSdk 33; defaultConfig { applicationId 'com.example.xomaster'; minSdk 21; targetSdk 33; versionCode 1; versionName '1.0' } }" >> app/build.gradle
          echo "dependencies { implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.material:material:1.8.0'; implementation 'androidx.constraintlayout:constraintlayout:2.1.4' }" >> app/build.gradle
        fi

        if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.xomaster">' > app/src/main/AndroidManifest.xml
          echo '<application android:allowBackup="true" android:label="XO Master" android:theme="@style/Theme.AppCompat.Light.NoActionBar">' >> app/src/main/AndroidManifest.xml
          echo '<activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity>' >> app/src/main/AndroidManifest.xml
          echo '</application></manifest>' >> app/src/main/AndroidManifest.xml
        fi

        if [ ! -f "app/src/main/java/com/example/xomaster/MainActivity.java" ]; then
          echo 'package com.example.xomaster;' > app/src/main/java/com/example/xomaster/MainActivity.java
          echo 'import android.os.Bundle; androidx.appcompat.app.AppCompatActivity;' >> app/src/main/java/com/example/xomaster/MainActivity.java
          echo 'public class MainActivity extends AppCompatActivity { @Override protected void onCreate(Bundle savedInstanceState) { super.onCreate(savedInstanceState); android.widget.TextView tv = new android.widget.TextView(this); tv.setText("XO Master Game"); tv.setTextSize(30); setContentView(tv); } }' >> app/src/main/java/com/example/xomaster/MainActivity.java
        fi

    - name: Build APK with Gradle
      run: |
        chmod +x gradlew || true
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        else
          gradle assembleDebug || echo "Gradle wrapper missing"
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
