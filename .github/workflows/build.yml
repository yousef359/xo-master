name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip and Organize in New Folder
      run: |
        if [ -f "clean_project.zip" ]; then
          mkdir -p my_project_build
          unzip -q clean_project.zip -d my_project_build
        fi

    - name: Ensure Gradle Wrapper and Build Debug APK
      run: |
        # تثبيت أداة الـ gradle على السيرفر لضمان نجاح توليد الـ wrapper
        sudo apt-get update && sudo apt-get install -y gradle

        PROJECT_DIR=$(find my_project_build -name "build.gradle" -exec dirname {} \; | head -n 1)
        
        if [ -z "$PROJECT_DIR" ]; then
          PROJECT_DIR="my_project_build"
        fi

        echo "Working directory is: $PROJECT_DIR"
        cd "$PROJECT_DIR"

        if [ ! -f "gradlew" ]; then
          echo "Generating Gradle wrapper..."
          gradle wrapper --gradle-version 8.0
        fi

        chmod +x gradlew || true
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
