name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip and Organize in New Folder
      run: |
        if [ -f "clean_project.zip" ]; then
          mkdir -p my_project_build
          unzip -q clean_project.zip -d my_project_build
        fi

    - name: Fix Gradle Version and Build Debug APK
      run: |
        PROJECT_DIR=$(find my_project_build -name "build.gradle" -exec dirname {} \; | head -n 1)
        
        if [ -z "$PROJECT_DIR" ]; then
          PROJECT_DIR="my_project_build"
        fi

        echo "Working directory is: $PROJECT_DIR"
        cd "$PROJECT_DIR"

        # تحديث إصدار Gradle تلقائياً ليتوافق مع البيئة الحديثة وتجنب أي أخطاء
        if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
          sed -i 's/distributionUrl=.*\\/gradle-.*-all\\.zip/distributionUrl=https\\://services.gradle.org/distributions/gradle-8.0-all.zip/g' gradle/wrapper/gradle-wrapper.properties
        fi

        chmod +x gradlew || true
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
