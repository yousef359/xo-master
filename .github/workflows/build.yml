name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip and Organize in New Folder
      run: |
        if [ -f "clean_project.zip" ]; then
          mkdir -p my_project_build
          unzip -q clean_project.zip -d my_project_build
        fi

    - name: Grant execute permission and Build Debug APK
      run: |
        # البحث التلقائي عن المجلد الذي يحتوي على ملف gradlew متغلغلاً داخل المجلدات الفرعية
        PROJECT_DIR=$(find my_project_build -name "gradlew" -exec dirname {} \;)
        
        if [ -n "$PROJECT_DIR" ]; then
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon
        else
          echo "Error: gradlew not found in any subfolders!"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
