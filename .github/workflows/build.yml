name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip and Organize Project Files
      run: |
        if [ -f "clean_project.zip" ]; then
          unzip -q clean_project.zip -d extracted_project
          # نقل محتويات المشروع المضغوط إلى الجذر الرئيسي للمستودع وترتيبها
          rsync -avh extracted_project/ ./ 
          rm -rf extracted_project
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          app/build/outputs/apk/debug/*.apk
          build/outputs/apk/debug/*.apk
