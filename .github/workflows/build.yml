name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract and Fix Project Files
      run: |
        if [ -f "app.zip" ]; then
          unzip -q app.zip -d .
        fi
        
        # البحث عن ملف الإعدادات أياً كان اسمه المكتوب وإعادة تسميته إلى settings.gradle
        for f in *settings*; do
          if [ -f "$f" ] && [ "$f" != "settings.gradle" ]; then
            cp "$f" settings.gradle
            break
          fi
        done

        if [ ! -f "settings.gradle" ]; then
          echo "include ':app'" > settings.gradle
        fi

    - name: Build with Gradle
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle wrapper
          ./gradlew assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          app/build/outputs/apk/debug/*.apk
          build/outputs/apk/debug/*.apk
